repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: repository hygiene
        entry: uv run python scripts/check_repository_hygiene.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: generated-api-reference
        name: generated API reference
        entry: pnpm --dir docs run check-generated
        language: system
        pass_filenames: false
