version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-major:
        update-types: [major]
      python-non-major:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      documentation-major:
        update-types: [major]
      documentation-non-major:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-major:
        update-types: [major]
      actions-non-major:
        update-types: [minor, patch]
