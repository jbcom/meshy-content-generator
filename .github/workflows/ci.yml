name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: CI / classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decision.outputs.skip }}
    steps:
      - id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [[ "$HEAD_REF" == release-please--branches--main--components--* ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      # Only release-please metadata PRs skip validation. Skipped jobs report
      # success, so exempting Dependabot bumps would let auto-merge land an
      # unverified dependency update on main.
      - id: decision
        env:
          RELEASE_SKIP: ${{ steps.release.outputs.skip }}
        run: |
          if [ "$RELEASE_SKIP" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
  python:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --all-extras --locked
      - run: uv run --locked --no-sync pytest
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync mypy src
      - run: uv build
  sonar:
    needs: classify
    # Dependabot runs cannot read SONAR_TOKEN, so the analysis is skipped for them.
    if: github.event_name != 'pull_request' || (needs.classify.outputs.skip != 'true' && github.actor != 'dependabot[bot]')
    name: SonarQube Cloud / analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.19"
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --all-extras --locked
      - run: uv run --locked --no-sync pytest --cov=meshy_content_generator --cov-report=xml:coverage.xml
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  docs:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      # docs/ is a standalone pnpm project: its lockfile sits next to its
      # manifest, which is where Dependabot looks.
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run validate
        working-directory: docs
      - run: pnpm run check-generated
        working-directory: docs
  gate:
    name: CI / gate
    if: always()
    needs: [classify, python, docs, sonar]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          SKIP: ${{ needs.classify.outputs.skip }}
          PYTHON: ${{ needs.python.result }}
          DOCS: ${{ needs.docs.result }}
          SONAR: ${{ needs.sonar.result }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$SKIP" = true ]; then
            echo 'Release metadata pull request: tests, documentation validation, and Sonar analysis intentionally skipped.'
            exit 0
          fi
          test "$PYTHON" = success && test "$DOCS" = success
          # Mirrors the sonar job condition: Dependabot pull request runs cannot
          # read SONAR_TOKEN, so only they may skip Sonar. Every other run,
          # including pushes to main, must have a successful analysis.
          if [ "$EVENT_NAME" = pull_request ] && [ "$ACTOR" = 'dependabot[bot]' ]; then
            test "$SONAR" = skipped
          else
            test "$SONAR" = success
          fi
