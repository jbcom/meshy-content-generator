name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: CI / classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decision.outputs.skip }}
    steps:
      - id: release
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && { [ "$AUTHOR" = 'release-please[bot]' ] || { [ "$AUTHOR" = 'app/github-actions' ] && [[ "$HEAD_REF" == release-please--branches--main--components--* ]]; }; }; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - id: dependabot
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: decision
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SKIP: ${{ steps.release.outputs.skip }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          if [ "$RELEASE_SKIP" = true ] || { [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] && [ "$AUTHOR" = 'dependabot[bot]' ] && [ -n "$UPDATE_TYPE" ] && [ "$UPDATE_TYPE" != 'version-update:semver-major' ]; }; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
  python:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --all-extras --locked
      - run: uv run --locked --no-sync pytest
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync mypy src
      - run: uv build
  sonar:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.skip != 'true'
    name: SonarQube Cloud / analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: uv sync --all-extras --locked
      - run: uv run --locked --no-sync pytest --cov=meshy_content_generator --cov-report=xml:coverage.xml
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  docs:
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir docs run validate
      - run: pnpm --dir docs run check-generated
  gate:
    name: CI / gate
    if: always()
    needs: [classify, python, docs, sonar]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          SKIP: ${{ needs.classify.outputs.skip }}
          PYTHON: ${{ needs.python.result }}
          DOCS: ${{ needs.docs.result }}
          SONAR: ${{ needs.sonar.result }}
        run: |
          if [ "$SKIP" = true ]; then
            echo 'Vetted automation pull request: tests, documentation validation, and Sonar analysis intentionally skipped.'
            exit 0
          fi
          test "$PYTHON" = success && test "$DOCS" = success && test "$SONAR" = success
